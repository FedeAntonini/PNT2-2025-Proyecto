<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Degradé del globo de chat -->
    <linearGradient id="bubbleGrad" x1="8" y1="8" x2="32" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#29d3b2"/>
      <stop offset="100%" stop-color="#1f8bb3"/>
    </linearGradient>
  </defs>

  <!-- SIN fondo: no hay <rect>, se ve el fondo del navbar -->

  <!-- Globo de chat con degradé -->
  <path
    d="M10 12 h18 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-8 l-4 4 v-4 h-6 a4 4 0 0 1 -4 -4 v-6 a4 4 0 0 1 4 -4 z"
    fill="url(#bubbleGrad)"
    stroke="#7ff4ff"
    stroke-width="1.4"
    stroke-linejoin="round"
  />

  <!-- Iniciales JC -->
  <text
    x="19.5"
    y="19.5"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="10.5"
    font-weight="700"
    fill="#e8fbff"
  >
    JC
  </text>

  <!-- Punto de notificación / online -->
  <circle cx="28" cy="10" r="3.3" fill="#20d064" stroke="#101926" stroke-width="1"/>
</svg>
